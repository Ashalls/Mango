appId: com.mango.app
productName: Mango
directories:
  buildResources: resources
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.*'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - 'node_modules/@anthropic-ai/claude-agent-sdk/**/*'
extraResources:
  - from: resources/
    to: .
    filter:
      - '*.html'
      - '*.png'
      - '*.jpg'
      - '*.gif'
      - '*.mp3'
  - from: resources/cats/
    to: cats/
  - from: resources/sounds/
    to: sounds/
publish:
  provider: github
  owner: Ashalls
  repo: Mango
win:
  executableName: Mango
  target:
    - nsis
  # Code signing — these env vars are populated by the GitHub Action.
  # CSC_LINK: base64-encoded .pfx file (`base64 -w 0 cert.pfx | gh secret set CSC_LINK`)
  # CSC_KEY_PASSWORD: the .pfx password
  # If neither is set, electron-builder produces an unsigned installer
  # (useful for local dev) — see signAndEditExecutable below.
  signAndEditExecutable: true
  # signingHashAlgorithms picked at runtime via env: SIGNING_HASH_ALGORITHMS
  signingHashAlgorithms:
    - sha256
  # rfc3161TimeStampServer is needed so the signature stays verifiable
  # after the cert expires. Most certificate vendors provide one.
  rfc3161TimeStampServer: http://timestamp.digicert.com
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: Mango-${version}-setup.${ext}
  shortcutName: Mango
  uninstallDisplayName: Mango
  # publisherName must match the Subject CN on the signing cert, otherwise
  # Windows SmartScreen will flag the installer as untrusted.
  # publisherName: "YOUR ORGANISATION LTD"
mac:
  icon: resources/icon.png
  category: public.app-category.developer-tools
  # Hardened runtime + notarization required for Gatekeeper acceptance on
  # macOS 10.15+. Leaves these disabled is what made the previous build
  # un-notarized. When CSC_LINK / APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD /
  # APPLE_TEAM_ID are set, electron-builder signs and notarizes.
  hardenedRuntime: true
  gatekeeperAssess: true
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  notarize: true
  target:
    - dmg
    - zip
  artifactName: Mango-${version}-mac.${ext}
dmg:
  artifactName: Mango-${version}.${ext}
linux:
  target:
    - AppImage
