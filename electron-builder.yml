appId: com.mango.app
productName: Mango
directories:
  buildResources: resources
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.*'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - 'node_modules/@anthropic-ai/claude-agent-sdk/**/*'
  # Audio elements stream via HTTP range requests; ASAR doesn't support
  # them, so MP3 playback from inside the archive cuts off after the first
  # ~100 ms. Unpack the renderer's bundled audio assets so Chromium can
  # stream them as real files. (The cat-sounds: meow on launch, purr on
  # Claude success, hiss on Claude failure.)
  - 'out/renderer/assets/*.mp3'
extraResources:
  - from: resources/
    to: .
    filter:
      - '*.html'
      - '*.png'
      - '*.jpg'
      - '*.gif'
      - '*.mp3'
  - from: resources/cats/
    to: cats/
  - from: resources/sounds/
    to: sounds/
publish:
  provider: github
  owner: Ashalls
  repo: Mango
win:
  executableName: Mango
  target:
    - nsis
  # Code signing is disabled — Mango ships unsigned. When you obtain an EV
  # or OV cert, populate the CSC_LINK / CSC_KEY_PASSWORD secrets in the
  # release workflow. Until then, Windows SmartScreen will show an
  # "unrecognized app" warning on first install, which is normal for
  # unsigned NSIS installers.
  #
  # signAndEditExecutable stays true (the default) so rcedit can still
  # bake the app icon, product name, and version info into Mango.exe.
  # Without it, the installed exe falls back to the generic Electron
  # icon on the taskbar / Start menu / Explorer. When no CSC_LINK is
  # set electron-builder skips the actual signing step.
  signAndEditExecutable: true
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: Mango-${version}-setup.${ext}
  shortcutName: Mango
  uninstallDisplayName: Mango
mac:
  icon: resources/icon.png
  category: public.app-category.developer-tools
  # No Apple Developer ID / notarization: ship unsigned. Gatekeeper will
  # refuse the app on first launch — users must right-click → Open, or
  # remove the quarantine attribute (`xattr -dr com.apple.quarantine Mango.app`).
  # When you join the Apple Developer Program, flip hardenedRuntime and
  # notarize to true and set the entitlements file path (the file is
  # already provided at resources/entitlements.mac.plist for that future
  # transition).
  hardenedRuntime: false
  gatekeeperAssess: false
  notarize: false
  target:
    - dmg
    - zip
  artifactName: Mango-${version}-mac.${ext}
dmg:
  artifactName: Mango-${version}.${ext}
linux:
  target:
    - AppImage
